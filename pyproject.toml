[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-sismico-mendoza"
version = "0.1.0"
description = "Pipeline reproducible para el catálogo sísmico de Mendoza"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]
